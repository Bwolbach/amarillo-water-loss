<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>City of Amarillo | Water Loss Calculator</title>
<style>
body {font-family: Arial; background:#f6f7f9; margin:0;}
header {background:#fff; padding:15px; border-bottom:4px solid #caa24a;}
.logo {height:70px;}
.container {max-width:900px; margin:20px auto; padding:15px; background:#fff; border-radius:10px;}
input, select {width:100%; padding:10px; margin:5px 0 15px;}
button {padding:12px; background:#caa24a; border:none; font-weight:bold; cursor:pointer;}
.result {margin-top:15px; font-size:18px; font-weight:bold;}
</style>
</head>

<body>

<header>
<img src="logo.webp" class="logo">
<h2>City of Amarillo – Water Loss Calculator</h2>
</header>

<div class="container">

<label>Break Type</label>
<select id="type">
<option value="rect">Rectangular Break</option>
<option value="circ">Circular Break</option>
<option value="hole">Hole in Pipe</option>
</select>

<label>Pressure (PSI)</label>
<input id="psi" value="60">

<label>Leak Time (Hours)</label>
<input id="hours" value="1">

<div id="rect">
<label>Length of Break (ft)</label>
<input id="r_len">

<label>Width of Break (in)</label>
<input id="r_width">
</div>

<div id="circ" style="display:none;">
<label>Pipe Diameter (in)</label>
<input id="c_diam">

<label>Width of Break (in)</label>
<input id="c_width">
</div>

<div id="hole" style="display:none;">
<label>Hole Diameter (in)</label>
<input id="h_diam">
</div>

<button onclick="calculate()">Calculate</button>
<button onclick="copyGallons()">Copy Gallons Only</button>

<div class="result" id="output"></div>

</div>

<script>
document.getElementById("type").addEventListener("change", function(){
  document.getElementById("rect").style.display="none";
  document.getElementById("circ").style.display="none";
  document.getElementById("hole").style.display="none";
  document.getElementById(this.value).style.display="block";
});

function gpm(area, psi){
  return 29.84 * area * Math.sqrt(psi);
}

function calculate(){
  const type=document.getElementById("type").value;
  const psi=parseFloat(document.getElementById("psi").value);
  const hours=parseFloat(document.getElementById("hours").value);

  let area=0;

  if(type==="rect"){
    const len=parseFloat(document.getElementById("r_len").value);
    const width=parseFloat(document.getElementById("r_width").value)/12;
    area=len*width;
  }

  if(type==="circ"){
    const diam=parseFloat(document.getElementById("c_diam").value);
    const width=parseFloat(document.getElementById("c_width").value);
    area=(Math.PI*diam*width)/144;
  }

  if(type==="hole"){
    const diam=parseFloat(document.getElementById("h_diam").value);
    area=(Math.PI*Math.pow(diam/2,2))/144;
  }

  const flow=gpm(area,psi);
  const gallons=Math.round(flow*60*hours);

  document.getElementById("output").innerHTML="Total Gallons Lost: "+gallons;
  document.getElementById("output").setAttribute("data-gallons",gallons);
}

function copyGallons(){
  const gallons=document.getElementById("output").getAttribute("data-gallons");
  if(!gallons){alert("Calculate first."); return;}
  navigator.clipboard.writeText(gallons);
  alert("Gallons copied!");
}
</script>

</body>
</html>
